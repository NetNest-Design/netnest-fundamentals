[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "netnest-fundamentals"
version = "0.1.3"
description = "Client for the NetNest Design Fundamentals API: company fundamentals and SEC filing events, with the source filing on every number."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NetNest Design LLC", email = "registrations@netnestdesign.com" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["sec", "edgar", "fundamentals", "xbrl", "10-k", "10-q", "financial data"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://api.netnestdesign.com/docs"
Source = "https://github.com/NetNest-Design/netnest-fundamentals"
Issues = "https://github.com/NetNest-Design/netnest-fundamentals/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/netnest_fundamentals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
