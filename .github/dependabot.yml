version: 2
updates:
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 is the Go compiler: tsup's declaration build needs the TypeScript 6 compiler API. Lift this when
      # tsup supports 7; TypeScript 6 keeps getting its own updates meanwhile.
      - dependency-name: typescript
        versions: ['>=7']
      # Node's type definitions follow the Node floor (engines >=22), so the build never relies on a newer Node API.
      - dependency-name: '@types/node'
        versions: ['>=23']
  - package-ecosystem: pip
    directories:
      - /python/netnest-fundamentals
      - /python/langchain-netnest
      - /python/llama-index-tools-netnest
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
