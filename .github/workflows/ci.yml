name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "python/netnest-fundamentals[test]" -e "python/langchain-netnest[test]" -e "python/llama-index-tools-netnest[test]"
      - run: python -m pytest -q python/netnest-fundamentals python/langchain-netnest python/llama-index-tools-netnest

  # One job, run in series: the shared demo token allows 2 requests a second.
  live:
    needs: [js, python]
    runs-on: ubuntu-latest
    concurrency:
      group: demo-token-live
      cancel-in-progress: false
    env:
      NETNEST_LIVE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: npm ci && npm run test:live
        working-directory: js
      - run: python -m pip install -e "python/netnest-fundamentals[test]" -e "python/langchain-netnest[test]" -e "python/llama-index-tools-netnest[test]"
      - run: python -m pytest -q -k live python/netnest-fundamentals python/langchain-netnest python/llama-index-tools-netnest
