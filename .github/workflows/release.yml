name: release
# On a tag v*: test, build, then publish with GitHub trusted publishing (OIDC). No publish token is stored anywhere:
# npm and PyPI each trust this workflow file in this repository, in the named environment.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Shares the demo token with the CI live job; never run the two at once.
    concurrency:
      group: demo-token-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: npm ci && npm run typecheck && npm test
        working-directory: js
      - run: python -m pip install -e "python/netnest-fundamentals[test]" -e "python/langchain-netnest[test]" -e "python/llama-index-tools-netnest[test]"
      - run: python -m pytest -q python/netnest-fundamentals python/langchain-netnest python/llama-index-tools-netnest
      - name: live smoke against production (demo key)
        run: |
          (cd js && npm run test:live)
          python -m pytest -q -k live python/netnest-fundamentals python/langchain-netnest python/llama-index-tools-netnest
        env:
          NETNEST_LIVE: '1'

  # One job per package: PyPI allows one pending publisher per repository, workflow and environment.
  pypi:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: netnest-fundamentals
            environment: pypi
          - package: langchain-netnest
            environment: pypi-langchain
          - package: llama-index-tools-netnest
            environment: pypi-llamaindex
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install build && python -m build -o dist "python/${{ matrix.package }}"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          skip-existing: true

  npm:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci
      # npm cannot create a package through trusted publishing: the first version is published once by hand, then npm
      # trusts this workflow. Until then this job reports and skips.
      - name: publish unless this version is already on npm
        run: |
          V=$(node -p "require('./package.json').version")
          if ! npm view netnest-fundamentals name >/dev/null 2>&1; then echo "::warning::netnest-fundamentals is not on npm yet; the first publish is manual"; exit 0; fi
          if npm view "netnest-fundamentals@$V" version >/dev/null 2>&1; then echo "netnest-fundamentals@$V already published"; else npm publish --provenance --access public; fi
