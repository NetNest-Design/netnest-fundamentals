name: release
# On a tag v*: the tag must equal every package's version, the full ci workflow passes, then each package publishes with
# GitHub trusted publishing (OIDC). No publish token is stored anywhere: npm and PyPI each trust this workflow file in
# this repository, in the named environment. Tool versions in the publishing jobs are pinned.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: the tag equals every package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          bad=0
          js=$(node -p "require('./js/package.json').version")
          [ "$js" = "$tag" ] || { echo "::error::js/package.json is $js, tag is $tag"; bad=1; }
          for p in netnest-fundamentals langchain-netnest llama-index-tools-netnest; do
            v=$(python3 -c "import tomllib; print(tomllib.load(open('python/$p/pyproject.toml','rb'))['project']['version'])")
            [ "$v" = "$tag" ] || { echo "::error::python/$p is $v, tag is $tag"; bad=1; }
          done
          exit $bad

  test:
    needs: versions
    uses: ./.github/workflows/ci.yml

  # One job per package: PyPI allows one pending publisher per repository, workflow and environment.
  pypi:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: netnest-fundamentals
            environment: pypi
          - package: langchain-netnest
            environment: pypi-langchain
          - package: llama-index-tools-netnest
            environment: pypi-llamaindex
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install "build==1.6.1" && python -m build -o dist "python/${{ matrix.package }}"
      # skip-existing only lets a rerun of a partly published tag finish: the versions job already proved this version
      # is the tag's.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          skip-existing: true

  npm:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11.20.0
      - run: npm ci
      # A rerun of a partly published tag skips the version npm already has. Any other lookup failure fails the job.
      - name: publish unless this version is already on npm
        run: |
          V=$(node -p "require('./package.json').version")
          out=$(npm view "netnest-fundamentals@$V" version 2>&1) && { echo "netnest-fundamentals@$V already published"; exit 0; }
          echo "$out" | grep -q E404 || { echo "::error::npm lookup failed: $out"; exit 1; }
          npm publish --provenance --access public
